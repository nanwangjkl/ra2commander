<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>RA2 Commander · 指挥工作台</title>
    <link rel="stylesheet" href="/commander/workbench.css" />
    <script type="module" src="/commander/workbench.js"></script>
  </head>
  <body>
    <main id="workbench">
      <section class="workspace" aria-label="游戏与指挥记录">
        <div class="game-surface">
          <iframe id="ra2c-game" name="ra2c-game" src="/" title="红色警戒游戏" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
        <div id="resize-sidebar" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" aria-controls="sidebar" tabindex="0"></div>
        <header class="sidebar-heading">
          <h1>RA2 Commander</h1>
          <p id="notice" role="status" hidden></p>
        </header>
        <aside id="sidebar" aria-label="指挥面板">
          <nav class="sidebar-tabs" role="tablist" aria-label="功能页" aria-orientation="horizontal">
            <button id="tab-commands" type="button" role="tab" aria-selected="true" aria-controls="page-commands" data-page="commands">指挥记录</button>
            <button id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="page-history" data-page="history" tabindex="-1">历史对战</button>
            <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="page-settings" data-page="settings" tabindex="-1">设置</button>
          </nav>
          <section id="page-commands" class="sidebar-page" role="tabpanel" aria-labelledby="tab-commands">
            <div id="command-cards" class="command-cards" aria-live="polite" hidden></div>
            <div class="empty-state" id="empty-state"><span class="empty-symbol" aria-hidden="true">≡</span><h2>暂无命令记录</h2><p>在这里查看指令、理解与执行反馈。</p></div>
            <footer class="composer">
              <form id="say-form">
                <button id="voice-enable" class="composer-icon" type="button" aria-label="启用麦克风" title="启用麦克风" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button>
                <div class="composer-field">
                  <input id="say-input" type="text" autocomplete="off" placeholder="输入指挥命令，回车提交" aria-label="指挥命令" aria-describedby="voice-status" />
                  <span id="voice-status" class="voice-status" role="status" hidden></span>
                </div>
                <button id="say-submit" class="composer-icon composer-action" type="submit" aria-label="下令" title="下令"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
                <button id="voice-hold" class="composer-icon composer-action" type="button" aria-label="按住说话" title="按住说话，松开下令" aria-pressed="false" disabled hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg></button>
              </form>
              <p class="composer-hint" hidden><span class="dot muted"></span><span id="events-status" role="status"></span></p>
            </footer>
          </section>
          <section id="page-history" class="sidebar-page" role="tabpanel" aria-labelledby="tab-history" tabindex="0" hidden>
            <div class="page-content">
              <div class="page-actions"><span>最近 10 局</span></div>
              <p id="history-status" class="page-message" role="status"></p>
              <div id="history-list" class="history-list"></div>
            </div>
          </section>
          <section id="page-settings" class="sidebar-page" role="tabpanel" aria-labelledby="tab-settings" tabindex="0" hidden>
            <div class="page-content">
              <form id="model-form" class="settings-form">
                <label>URL<input id="model-url" type="url" required autocomplete="off" placeholder="https://api.example.com/v1" maxlength="2048" /></label>
                <label>API Key<input id="model-key" type="password" autocomplete="new-password" placeholder="填写服务的 API Key" maxlength="8192" /></label>
                <label>模型名称<input id="model-model" type="text" required autocomplete="off" placeholder="模型 ID" maxlength="200" /></label>
                <div class="settings-actions"><button id="model-save" type="submit">保存</button><button id="model-test" type="button">测试连接</button></div>
              </form>
              <p id="model-status" class="page-message" role="status"></p>
              <h2 class="settings-section-title">语音输入</h2>
              <form id="speech-form" class="settings-form">
                <label>麦克风<select id="speech-device"><option value="">系统默认麦克风</option></select></label>
                <label>录音按键<select id="speech-key"><option value="Backquote">反引号 `</option><option value="ControlRight">右 Ctrl</option><option value="AltRight">右 Alt</option><option value="F8">F8</option><option value="F9">F9</option></select></label>
                <div class="settings-actions"><button type="submit">保存语音设置</button><button id="speech-reload" type="button">重新加载识别器</button></div>
              </form>
              <p id="speech-settings-status" class="page-message" role="status"></p>
            </div>
          </section>
        </aside>
        <footer class="status-bar" aria-label="工作台状态">
          <div class="connection" role="status"><span id="connection-dot" class="dot"></span><span id="connection-text">正在连接</span></div>
          <button id="toggle-sidebar" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="切换侧栏" title="收起／展开侧栏">收起侧栏</button>
        </footer>
      </section>
    </main>
  </body>
</html>
